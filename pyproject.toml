[project]
name = "learn-ai-engineering"
version = "0.1.0"
description = "Shared Python environment for Learn AI Engineering tutorials"
requires-python = "==3.12.11"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "openrouter==1.3.194",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false
required-version = "==0.7.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
